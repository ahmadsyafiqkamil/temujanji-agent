services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temujanji
      POSTGRES_PASSWORD: temujanji
      POSTGRES_DB: temujanji
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://temujanji:temujanji@postgres:5432/temujanji
    depends_on:
      - postgres
  web:
    image: node:22-bookworm
    working_dir: /app/frontend
    command: sh -c "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
  agent:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app
    command: uv run adk web --host 0.0.0.0 --port 8001 --session_service_uri=memory:// /app/agent
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      TEMUJANJI_API_BASE: http://api:8000/api/v1
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:-http://localhost:3000}
    depends_on:
      - api
  telegram:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app
    command: uv run uvicorn telegram.bot:app --host 0.0.0.0 --port 8002
    volumes:
      - ./:/app
    ports:
      - "8002:8002"
    environment:
      TEMUJANJI_API_BASE: http://api:8000/api/v1
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:-http://localhost:3000}
    depends_on:
      - api
volumes:
  pgdata:
