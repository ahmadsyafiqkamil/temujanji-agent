[project]
name = "temujanji-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=6.0,<7",
  "djangorestframework>=3.15.0",
  "djangorestframework-simplejwt>=5.3.0",
  "django-cors-headers>=4.6.0",
  "psycopg[binary]>=3.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "google-adk[extensions]>=2.6.2",
  "python-dotenv>=1.2.2",
  "litellm>=1.84.0,<1.90.0",
  "qrcode[pil]>=8.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-django>=4.9.0",
  "pytest-asyncio>=0.24.0",
  "factory-boy>=3.3.0",
  "respx>=0.23.1",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "temujanji.settings_test"
asyncio_mode = "auto"
testpaths = ["backend/tests", "agent/tests"]
pythonpath = ["backend", "."]
python_files = ["test_*.py"]
